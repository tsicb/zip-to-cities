<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zipcode ETL</title>

  <style>
    :root {
      --bg: #0b0f17;
      --panel: rgba(255, 255, 255, 0.08);
      --panel-strong: rgba(255, 255, 255, 0.12);
      --border: rgba(255, 255, 255, 0.14);
      --text: #f5f7fb;
      --muted: #9aa4b2;
      --accent: #74d4ff;
      --accent-2: #9cffcb;
      --danger: #ff9aa2;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      position: relative;
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family:
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
      background:
        radial-gradient(circle at 18% 12%, rgba(116, 212, 255, 0.20), transparent 32%),
        radial-gradient(circle at 86% 18%, rgba(156, 255, 203, 0.16), transparent 30%),
        radial-gradient(circle at 50% 88%, rgba(116, 212, 255, 0.08), transparent 34%),
        linear-gradient(145deg, #070a10, #101725 58%, #090d14);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(
          120deg,
          rgba(116, 212, 255, 0.08),
          transparent 30%,
          rgba(156, 255, 203, 0.08) 70%,
          transparent
        );
      opacity: 0.9;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), transparent 85%);
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0;
    }

    .hero {
      margin-bottom: 28px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.06);
      font-size: 13px;
      letter-spacing: 0.02em;
      backdrop-filter: blur(16px);
      box-shadow:
        0 12px 34px rgba(0, 0, 0, 0.24),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 18px rgba(156, 255, 203, 0.8);
    }

    h1 {
      margin: 22px 0 10px;
      font-size: clamp(32px, 5vw, 54px);
      line-height: 1.05;
      letter-spacing: -0.05em;
      text-shadow: 0 18px 60px rgba(116, 212, 255, 0.15);
    }

    .lead {
      max-width: 720px;
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.9;
    }

    .panel {
      position: relative;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.055)),
        linear-gradient(135deg, rgba(116, 212, 255, 0.10), rgba(156, 255, 203, 0.055));
      box-shadow:
        0 32px 90px rgba(0, 0, 0, 0.52),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
      overflow: hidden;
      backdrop-filter: blur(20px);
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      pointer-events: none;
      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.22),
          transparent 28%,
          transparent 70%,
          rgba(116, 212, 255, 0.15)
        );
      opacity: 0.8;
    }

    .panel-inner {
      position: relative;
      z-index: 1;
      padding: 28px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 18px;
    }

    @media (max-width: 760px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .upload {
      position: relative;
      display: flex;
      min-height: 210px;
      align-items: center;
      justify-content: center;
      padding: 24px;
      border: 1px dashed rgba(255, 255, 255, 0.28);
      border-radius: 20px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.035)),
        radial-gradient(circle at 50% 0%, rgba(116, 212, 255, 0.12), transparent 58%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        0 18px 44px rgba(0, 0, 0, 0.20);
      transition: 0.18s ease;
    }

    .upload:hover {
      transform: translateY(-2px);
      border-color: rgba(116, 212, 255, 0.75);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.085), rgba(255, 255, 255, 0.04)),
        radial-gradient(circle at 50% 0%, rgba(116, 212, 255, 0.18), transparent 60%);
      box-shadow:
        0 24px 58px rgba(0, 0, 0, 0.28),
        0 0 40px rgba(116, 212, 255, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.16);
    }

    .upload input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .upload input:disabled {
      cursor: not-allowed;
    }

    .upload-content {
      text-align: center;
      pointer-events: none;
    }

    .upload-icon {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      margin: 0 auto 16px;
      border-radius: 18px;
      background:
        linear-gradient(135deg, rgba(116, 212, 255, 0.22), rgba(156, 255, 203, 0.14));
      color: var(--accent);
      font-size: 26px;
      box-shadow:
        0 10px 30px rgba(116, 212, 255, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .upload-title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .upload-sub {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .settings {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.035));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        0 18px 44px rgba(0, 0, 0, 0.18);
    }

    .settings-title {
      margin: 0 0 16px;
      font-size: 14px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .toggle-row:first-of-type {
      border-top: none;
      padding-top: 0;
    }

    .toggle-label {
      min-width: 0;
    }

    .toggle-label strong {
      display: block;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .toggle-label span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .switch {
      position: relative;
      flex: 0 0 auto;
      width: 54px;
      height: 30px;
    }

    .switch input {
      display: none;
    }

    .slider {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.16);
      cursor: pointer;
      transition: 0.18s ease;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      left: 3px;
      top: 3px;
      border-radius: 50%;
      background: #ffffff;
      transition: 0.18s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }

    .switch input:checked + .slider {
      background: rgba(116, 212, 255, 0.35);
      border-color: rgba(116, 212, 255, 0.8);
      box-shadow:
        0 0 24px rgba(116, 212, 255, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }

    .switch input:checked + .slider::before {
      transform: translateX(24px);
      background: var(--accent);
    }

    .mini {
      margin-top: 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .status {
      position: relative;
      z-index: 1;
      margin-top: 0;
      padding: 18px 20px;
      min-height: 116px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.20), rgba(0, 0, 0, 0.32));
      color: var(--muted);
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Consolas,
        "Liberation Mono",
        monospace;
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .status.ok {
      color: var(--accent-2);
    }

    .status.warn {
      color: var(--danger);
    }

    code {
      padding: 2px 7px;
      border-radius: 7px;
      color: #dff6ff;
      background: rgba(255, 255, 255, 0.08);
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Consolas,
        "Liberation Mono",
        monospace;
      font-size: 0.92em;
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="hero">
      <div class="badge">
        <span class="dot"></span>
        CSV ZIPCODE ETL
      </div>

      <h1>郵便番号から<br>住所コードを付与</h1>

      <p class="lead">
        <code>郵便番号1</code> をもとに、
        <code>県コード1</code> と <code>市区町村コード1</code> を自動付与します。
        <code>市区町村コード1</code> は下3桁のみ出力します。
        必要に応じて、都道府県名・市区町村名も出力できます。
      </p>
    </section>

    <section class="panel">
      <div class="panel-inner">
        <div class="grid">
          <label class="upload">
            <input id="csvInput" type="file" accept=".csv,text/csv" disabled />
            <div class="upload-content">
              <div class="upload-icon">↥</div>
              <p class="upload-title">CSVをアップロード</p>
              <p class="upload-sub">UTF-8 / Shift_JIS に対応</p>
            </div>
          </label>

          <aside class="settings">
            <p class="settings-title">Options</p>

            <div class="toggle-row">
              <div class="toggle-label">
                <strong>住所名列を出力</strong>
                <span>
                  ONにすると <code>都道府県</code> / <code>市区町村</code> を出力します。
                </span>
              </div>

              <label class="switch" aria-label="住所名列を出力">
                <input id="nameColumnsToggle" type="checkbox" />
                <span class="slider"></span>
              </label>
            </div>

            <p class="mini">
              OFFの場合、元CSVに <code>都道府県</code> / <code>市区町村</code> が存在していても、
              出力CSVからは除外します。
            </p>
          </aside>
        </div>
      </div>

      <div id="status" class="status">初期化中です...</div>
    </section>
  </main>

  <script>
    const ZIP_MASTER_PATH = "./zipcode_master.json";
    const CITY_MASTER_PATH = "./city_master.json";

    const PREF_NAMES = {
      "1": "北海道",
      "2": "青森県",
      "3": "岩手県",
      "4": "宮城県",
      "5": "秋田県",
      "6": "山形県",
      "7": "福島県",
      "8": "茨城県",
      "9": "栃木県",
      "10": "群馬県",
      "11": "埼玉県",
      "12": "千葉県",
      "13": "東京都",
      "14": "神奈川県",
      "15": "新潟県",
      "16": "富山県",
      "17": "石川県",
      "18": "福井県",
      "19": "山梨県",
      "20": "長野県",
      "21": "岐阜県",
      "22": "静岡県",
      "23": "愛知県",
      "24": "三重県",
      "25": "滋賀県",
      "26": "京都府",
      "27": "大阪府",
      "28": "兵庫県",
      "29": "奈良県",
      "30": "和歌山県",
      "31": "鳥取県",
      "32": "島根県",
      "33": "岡山県",
      "34": "広島県",
      "35": "山口県",
      "36": "徳島県",
      "37": "香川県",
      "38": "愛媛県",
      "39": "高知県",
      "40": "福岡県",
      "41": "佐賀県",
      "42": "長崎県",
      "43": "熊本県",
      "44": "大分県",
      "45": "宮崎県",
      "46": "鹿児島県",
      "47": "沖縄県"
    };

    const state = {
      zipIndex: new Map(),
      cityNameMap: new Map(),
      ambiguousZipCount: 0
    };

    const $status = document.getElementById("status");
    const $csvInput = document.getElementById("csvInput");
    const $nameColumnsToggle = document.getElementById("nameColumnsToggle");

    function setStatus(message, type = "") {
      $status.textContent = message;
      $status.className = "status" + (type ? " " + type : "");
    }

    async function loadJson(path, required) {
      const res = await fetch(path, { cache: "no-store" });

      if (!res.ok) {
        if (required) {
          throw new Error(`${path} を読み込めませんでした。index.html と同じ階層に配置してください。`);
        }
        return null;
      }

      return await res.json();
    }

    function normalizeZip(value) {
      const digits = String(value ?? "").replace(/[^\d]/g, "");
      if (!digits) return "";
      return digits.padStart(7, "0").slice(-7);
    }

    function normalizeCityCode(value) {
      const digits = String(value ?? "").replace(/[^\d]/g, "");
      if (!digits) return "";
      return digits.padStart(5, "0");
    }

    function toMunicipalityCode3(value) {
      const fullCode = normalizeCityCode(value);
      if (!fullCode) return "";
      return fullCode.slice(-3);
    }

    function buildZipIndex(zipMaster) {
      const index = new Map();
      const ambiguous = new Set();

      for (const rec of zipMaster) {
        const zip = normalizeZip(rec.zip);
        if (!zip) continue;

        if (!index.has(zip)) {
          index.set(zip, rec);
          continue;
        }

        const existing = index.get(zip);
        const existingKey = `${existing.pref}|${normalizeCityCode(existing.city)}`;
        const newKey = `${rec.pref}|${normalizeCityCode(rec.city)}`;

        if (existingKey !== newKey) {
          ambiguous.add(zip);
        }
      }

      state.zipIndex = index;
      state.ambiguousZipCount = ambiguous.size;
    }

    function buildCityNameMap(raw) {
      const map = new Map();
      if (!raw) return map;

      if (Array.isArray(raw)) {
        for (const item of raw) {
          const code =
            item.code ??
            item.cityCode ??
            item.city_code ??
            item.municipalityCode ??
            item["市区町村コード"] ??
            item["市区町村コード1"];

          const name =
            item.name ??
            item.cityName ??
            item.city_name ??
            item.municipalityName ??
            item["市区町村"] ??
            item["市区町村名"];

          if (code && name) {
            map.set(String(code), String(name));
            map.set(normalizeCityCode(code), String(name));
          }
        }

        return map;
      }

      if (typeof raw === "object") {
        for (const [code, value] of Object.entries(raw)) {
          let name = "";

          if (typeof value === "string") {
            name = value;
          } else if (value && typeof value === "object") {
            name =
              value.name ??
              value.cityName ??
              value.city_name ??
              value.municipalityName ??
              value["市区町村"] ??
              value["市区町村名"] ??
              "";
          }

          if (name) {
            map.set(String(code), String(name));
            map.set(normalizeCityCode(code), String(name));
          }
        }
      }

      return map;
    }

    function decodeCsvBuffer(buffer) {
      try {
        return new TextDecoder("utf-8", { fatal: true }).decode(buffer).replace(/^\uFEFF/, "");
      } catch (e) {
        return new TextDecoder("shift_jis").decode(buffer).replace(/^\uFEFF/, "");
      }
    }

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];

        if (inQuotes) {
          if (ch === '"' && next === '"') {
            cell += '"';
            i++;
          } else if (ch === '"') {
            inQuotes = false;
          } else {
            cell += ch;
          }
          continue;
        }

        if (ch === '"') {
          inQuotes = true;
        } else if (ch === ",") {
          row.push(cell);
          cell = "";
        } else if (ch === "\n") {
          row.push(cell);
          rows.push(row);
          row = [];
          cell = "";
        } else if (ch === "\r") {
          // CRLFのCRは無視
        } else {
          cell += ch;
        }
      }

      row.push(cell);

      if (row.length > 1 || row[0] !== "") {
        rows.push(row);
      }

      return rows;
    }

    function toCSV(rows) {
      return rows.map(row => {
        return row.map(value => {
          const s = String(value ?? "");
          const needsQuote = /[",\r\n]/.test(s) || /^\s|\s$/.test(s);
          const escaped = s.replace(/"/g, '""');
          return needsQuote ? `"${escaped}"` : escaped;
        }).join(",");
      }).join("\r\n");
    }

    function ensureColumn(header, dataRows, columnName) {
      let idx = header.indexOf(columnName);

      if (idx === -1) {
        idx = header.length;
        header.push(columnName);

        for (const row of dataRows) {
          row[idx] = "";
        }
      }

      return idx;
    }

    function removeColumns(rows, columnIndexesToRemove) {
      const removeSet = new Set(columnIndexesToRemove);

      return rows.map(row => {
        return row.filter((_, index) => !removeSet.has(index));
      });
    }

    function getBaseName(fileName) {
      return fileName.replace(/\.[^.]*$/, "");
    }

    function downloadTextAsFile(text, fileName) {
      const blob = new Blob([text], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();

      a.remove();
      URL.revokeObjectURL(url);
    }

    async function processCSV(file) {
      const shouldOutputNameColumns = $nameColumnsToggle.checked;

      setStatus("CSVを読み込んでいます...");

      const buffer = await file.arrayBuffer();
      const csvText = decodeCsvBuffer(buffer);
      const rows = parseCSV(csvText);

      if (rows.length === 0) {
        throw new Error("CSVにデータがありません。");
      }

      const header = rows[0].map((h) => {
        return String(h ?? "").replace(/^\uFEFF/, "").trim();
      });

      const dataRows = rows.slice(1);

      const zipIdx = header.indexOf("郵便番号1");
      if (zipIdx === -1) {
        throw new Error("CSV内に「郵便番号1」ヘッダーが見つかりません。");
      }

      const prefCodeIdx = ensureColumn(header, dataRows, "県コード1");
      const cityCodeIdx = ensureColumn(header, dataRows, "市区町村コード1");

      let prefNameIdx = -1;
      let cityNameIdx = -1;

      if (shouldOutputNameColumns) {
        prefNameIdx = ensureColumn(header, dataRows, "都道府県");
        cityNameIdx = ensureColumn(header, dataRows, "市区町村");
      }

      let matched = 0;
      let unmatched = 0;
      let cityNameMissing = 0;

      for (const row of dataRows) {
        while (row.length < header.length) row.push("");

        const zip = normalizeZip(row[zipIdx]);
        const rec = state.zipIndex.get(zip);

        if (!zip || !rec) {
          row[prefCodeIdx] = "";
          row[cityCodeIdx] = "";

          if (shouldOutputNameColumns) {
            row[prefNameIdx] = "";
            row[cityNameIdx] = "";
          }

          unmatched++;
          continue;
        }

        const prefCode = String(rec.pref ?? "");
        const cityCodeRaw = String(rec.city ?? "");
        const normalizedCityCode = normalizeCityCode(cityCodeRaw);
        const municipalityCode3 = toMunicipalityCode3(cityCodeRaw);

        row[prefCodeIdx] = prefCode;

        // ここが今回の修正点：
        // 市区町村コード1には、都道府県コードを除いた下3桁のみ出力する
        row[cityCodeIdx] = municipalityCode3;

        if (shouldOutputNameColumns) {
          const prefName =
            rec.prefName ??
            rec.pref_name ??
            rec.prefecture ??
            PREF_NAMES[String(Number(prefCode))] ??
            "";

          const cityName =
            rec.cityName ??
            rec.city_name ??
            rec.municipalityName ??
            state.cityNameMap.get(cityCodeRaw) ??
            state.cityNameMap.get(normalizedCityCode) ??
            "";

          row[prefNameIdx] = prefName;
          row[cityNameIdx] = cityName;

          if (!cityName) {
            cityNameMissing++;
          }
        }

        matched++;
      }

      let outputRows = [header, ...dataRows];

      if (!shouldOutputNameColumns) {
        const removeIndexes = [];

        const prefNameExistingIdx = header.indexOf("都道府県");
        const cityNameExistingIdx = header.indexOf("市区町村");

        if (prefNameExistingIdx !== -1) removeIndexes.push(prefNameExistingIdx);
        if (cityNameExistingIdx !== -1) removeIndexes.push(cityNameExistingIdx);

        outputRows = removeColumns(outputRows, removeIndexes);
      }

      // Excelで開きやすいようにUTF-8 BOM付きで出力
      const outputCsv = "\uFEFF" + toCSV(outputRows);
      const outputName = `${getBaseName(file.name)}_zipcode_etl.csv`;

      downloadTextAsFile(outputCsv, outputName);

      const lines = [
        "処理が完了しました。",
        `入力行数: ${dataRows.length.toLocaleString()}件`,
        `郵便番号マッチ: ${matched.toLocaleString()}件`,
        `未取得: ${unmatched.toLocaleString()}件`,
        `市区町村コード1: 下3桁のみ出力`,
        `住所名列: ${shouldOutputNameColumns ? "出力する" : "出力しない"}`,
        `ダウンロードファイル: ${outputName}`
      ];

      if (shouldOutputNameColumns) {
        lines.splice(
          6,
          0,
          `市区町村名未取得: ${cityNameMissing.toLocaleString()}件`
        );
      }

      const hasWarning =
        unmatched > 0 ||
        (shouldOutputNameColumns && cityNameMissing > 0);

      setStatus(lines.join("\n"), hasWarning ? "warn" : "ok");
    }

    async function init() {
      try {
        setStatus("郵便番号マスタを読み込んでいます...");

        const zipMaster = await loadJson(ZIP_MASTER_PATH, true);
        buildZipIndex(zipMaster);

        const cityMaster = await loadJson(CITY_MASTER_PATH, false);
        state.cityNameMap = buildCityNameMap(cityMaster);

        const lines = [
          `郵便番号マスタ: ${state.zipIndex.size.toLocaleString()}件`,
          `市区町村名マスタ: ${state.cityNameMap.size.toLocaleString()}件`,
          `同一郵便番号で県・市区町村コードが分かれる可能性: ${state.ambiguousZipCount.toLocaleString()}件`,
          "",
          "CSVをアップロードすると、自動で変換してダウンロードします。",
          "市区町村コード1は下3桁のみ出力します。",
          "住所名列の出力は右側のトグルで切り替えできます。"
        ];

        setStatus(lines.join("\n"), "ok");
        $csvInput.disabled = false;
      } catch (err) {
        setStatus(err.message, "warn");
        $csvInput.disabled = true;
      }
    }

    $csvInput.addEventListener("change", async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      try {
        await processCSV(file);
      } catch (err) {
        setStatus(err.message, "warn");
      } finally {
        event.target.value = "";
      }
    });

    init();
  </script>
</body>
</html>
